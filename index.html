<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대기 안정도와 강수 — 시뮬레이션 실험실</title>
<meta name="description" content="단열 변화, 푄 현상, 대기 안정도, 단열선도 탐구, 안개와 강수 과정을 시뮬레이션으로 탐구하는 지구과학 수업용 웹앱">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d7489'/%3E%3Cpath d='M10 20a5 5 0 1 1 1.6-9.7A6 6 0 0 1 23 12a4 4 0 0 1-1 8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <a class="brand" id="homeLink" href="#" title="처음 화면으로" aria-label="대기 안정도와 강수 — 처음 화면으로">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19a5 5 0 1 1 1.4-9.8A6.5 6.5 0 0 1 23 11a4 4 0 0 1-.5 8z" fill="#fff" fill-opacity=".18"/>
          <path d="M11 23l-1 3M16 23l-1 3M21 23l-1 3"/>
        </svg>
      </span>
      <span class="brand-text">
        <h1>대기 안정도와 강수</h1>
        <p>단열 변화부터 안개·강수 과정까지 · 시뮬레이션 실험실</p>
      </span>
    </a>
    <div class="progress">
      <div class="progress-chip" title="미션으로 모은 별">
        <span class="star">⭐</span>
        <span class="num" id="star-total">0 / 18</span>
        <span class="progress-bar"><span id="star-bar"></span></span>
      </div>
      <button class="icon-btn" id="reset-stars" title="별 초기화 (새 수업 시작)" aria-label="별 초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabbar" role="tablist" aria-label="실험실 선택">
    <button class="tab" role="tab" id="tabbtn-tab1" aria-controls="tab1" aria-selected="true">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6"/><path d="M12 9V2M9 5l3-3 3 3"/></svg></span>
      <span class="tab-num">1</span>단열 변화<span class="tab-stars" data-tab="tab1"></span>
    </button>
    <button class="tab" role="tab" id="tabbtn-tab2" aria-controls="tab2" aria-selected="false">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21l7-11 4 6 3-4 6 9z"/><path d="M13 4h8M16 7.5h5"/></svg></span>
      <span class="tab-num">2</span>푄 현상<span class="tab-stars" data-tab="tab2"></span>
    </button>
    <button class="tab" role="tab" id="tabbtn-tab3" aria-controls="tab3" aria-selected="false">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M4 7h16"/><path d="M4 7l-2.5 6a2.8 2.8 0 0 0 5 0zM20 7l-2.5 6a2.8 2.8 0 0 0 5 0z"/></svg></span>
      <span class="tab-num">3</span>대기 안정도<span class="tab-stars" data-tab="tab3"></span>
    </button>
    <button class="tab" role="tab" id="tabbtn-tab4" aria-controls="tab4" aria-selected="false">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M8 17l3-6-2-4M13 17l3-8"/></svg></span>
      <span class="tab-num">4</span>단열선도 탐구<span class="tab-stars" data-tab="tab4"></span>
    </button>
    <button class="tab" role="tab" id="tabbtn-tab5" aria-controls="tab5" aria-selected="false">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M3 12h18M5 16h14M8 20h8M9 4h6"/></svg></span>
      <span class="tab-num">5</span>안개<span class="tab-stars" data-tab="tab5"></span>
    </button>
    <button class="tab" role="tab" id="tabbtn-tab6" aria-controls="tab6" aria-selected="false">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 1 1 .9-7.9A5.5 5.5 0 0 1 18 9a3 3 0 0 1-.5 6z"/><path d="M8 18.5l-1 2.5M12.5 18.5l-1 2.5M17 18.5l-1 2.5"/></svg></span>
      <span class="tab-num">6</span>강수 과정<span class="tab-stars" data-tab="tab6"></span>
    </button>
  </nav>
</header>

<main id="main">
  <section class="tab-panel active" id="tab1" role="tabpanel" aria-labelledby="tabbtn-tab1"></section>
  <section class="tab-panel" id="tab2" role="tabpanel" aria-labelledby="tabbtn-tab2"></section>
  <section class="tab-panel" id="tab3" role="tabpanel" aria-labelledby="tabbtn-tab3"></section>
  <section class="tab-panel" id="tab4" role="tabpanel" aria-labelledby="tabbtn-tab4"></section>
  <section class="tab-panel" id="tab5" role="tabpanel" aria-labelledby="tabbtn-tab5"></section>
  <section class="tab-panel" id="tab6" role="tabpanel" aria-labelledby="tabbtn-tab6"></section>
</main>

<footer>© 2026 제작: 김연경(earthssaem@gmail.com) | <a class="hub" href="https://earthssaem-lab.vercel.app/" target="_blank" rel="noopener">연경쌤의 지구과학 실험실 둘러보기 →</a></footer>

<!-- 미션 성공 알림 -->
<div class="celebrate" id="celebrate" aria-live="polite">
  <div class="celebrate-card">
    <span class="big-star">⭐</span>
    <div><div class="msg" id="celebrate-msg">미션 성공!</div><div class="sub" id="celebrate-sub"></div></div>
  </div>
</div>

<!-- 수료증 -->
<div class="cert-overlay" id="cert-overlay" role="dialog" aria-modal="true" aria-labelledby="cert-title">
  <div class="cert-card">
    <div class="trophy">🏆</div>
    <h2 id="cert-title">기상 마스터 수료증</h2>
    <div class="cert-stars">⭐⭐⭐ ⭐⭐⭐ ⭐⭐⭐<br>⭐⭐⭐ ⭐⭐⭐ ⭐⭐⭐</div>
    <p>단열 변화 · 푄 현상 · 대기 안정도 · 단열선도 · 안개 · 강수 과정의<br>모든 미션을 완수하여 <b>기상 마스터</b>가 되었음을 증명합니다.</p>
    <button class="btn big" id="cert-close">🎉 축하 인사 받기</button>
  </div>
</div>
